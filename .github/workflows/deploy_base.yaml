name: AWS Deploy Base

on:
  workflow_call:
    inputs:
      environment:
        description: "One of 'prod' or 'dev'"
        required: true
        type: string
    secrets:
      DOCKER_REPO:
        description: ECR Docker repo to push to
        required: true
      AWS_ROLE_ARN:
        description: AWS_ROLE_ARN
        required: true

env:
  # must match odout.tf in the terraform-aws-mbta-odin module
  ECS_CLUSTER: odin
  ECS_SERVICE: odout-${{ inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v3
      - name: Configure AWS credentials
        id: setup-aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Extract version information
        id: generate-version
        run: |
          git fetch --tags
          VERSION=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="${VERSION}-${SHA}"
          echo "version=${FULL_VERSION}" >> $GITHUB_ENV
      - name: Build and Push Docker Image
        id: build-push
        uses: mbta/actions/build-push-ecr@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          docker-repo: ${{ secrets.DOCKER_REPO }}
          docker-additional-args: --build-arg VERSION=${{ env.version }}
      - name: Deploy Quack Service
        id: deploy-ecs
        uses: mbta/actions/deploy-ecs@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          ecs-cluster: ${{ env.ECS_CLUSTER }}
          ecs-service: ${{ env.ECS_SERVICE }}
          docker-tag: ${{ steps.build-push.outputs.docker-tag }}
          allow-zero-desired: false
